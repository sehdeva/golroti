<!doctype html>
<html>
  <head>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link type="text/css" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" media="screen,projection" />
    <link type="text/css" rel="stylesheet" href="./css/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>Gol Roti - Fresh Roti Delivery in Faridabad</title>
  </head>

  <body>
		<header>
			<nav>
				<div class="nav-wrapper red darken-2">
					<a href="javascript:void(0)" class="brand-logo">Gol Roti</a>
					<ul id="nav-mobile" class="right">
						<li><a href="tel:918882202779"><i class="material-icons">phone</i></a></li>
						<li><a href="https://wa.me/918882202779"><img src="./assets/whatsapp-256.png"></a></li>
					</ul>
				</div>
			</nav>
		</header>

		<main>
			<div id="home-main-banner">
				<div>
					<div id="home-main-form">
						<div class="input-field col">
							<i class="material-icons prefix">business</i>
							<input disabled id="form_society" type="text" value="BPTP Discovery Park - 80">
							<label for="form_society">Society</label>
						</div>

						<div class="input-field col">
							<i class="material-icons prefix">pin</i>
							<input id="form_flat" type="text">
							<label for="form_flat">Flat No</label>
						</div>

						<div class="input-field col">
							<i class="material-icons prefix">phone_android</i>
							<input id="form_phone" type="text">
							<label for="form_phone">Contact No</label>
						</div>

						<div class="input-field col">
							<p style="margin-left: 5px;">
								<label>
									<input id="form_sub" type="checkbox" class="filled-in" onchange="updateSub()" checked />
									<span>Subscription Order</span>
								</label>
							</p>
						</div>

						<div class="small-gap"></div>

						<div id="form_days_holder" class="input-field col">
							<i class="material-icons prefix">date_range</i>
							<select id="form_days" multiple>
								<option value="Monday" selected>Monday</option>
								<option value="Tuesday" selected>Tuesday</option>
								<option value="Wednesday" selected>Wednesday</option>
								<option value="Thursday" selected>Thursday</option>
								<option value="Friday" selected>Friday</option>
								<option value="Saturday" selected>Saturday</option>
								<option value="Sunday" selected>Sunday</option>
							</select>
							<label>Delivery Days</label>
						</div>

						<div class="input-field col time-container">
							<p style="margin: 0 42px; padding-top: 11px;">Delivery Time</p>
							<p>
								<i class="material-icons prefix">access_time</i>
								<label>
									<input name="form_time" value="7:00 - 7:30 PM" type="radio" />
									<span>7:00 - 7:30 PM</span>
								</label>

								<label>
									<input name="form_time" value="7:30 - 8:00 PM" type="radio" />
									<span>7:30 - 8:00 PM</span>
								</label>

								<label>
									<input name="form_time" value="8:00 - 8:30 PM" type="radio" checked />
									<span>8:00 - 8:30 PM</span>
								</label>

								<label>
									<input name="form_time" value="8:30 - 9:00 PM" type="radio" />
									<span>8:30 - 9:00 PM</span>
								</label>
							</p>
						</div>

						<div>
							<div class="grid-item">
								<div class="grid-title">
									Sharbati Atta Roti &bull; ₹12
								</div>
								<div class="grid-qty-ctrl">
									<button onclick="updateQty(this, -12)">-</button>
									<span class="qty">0</span>
									<button onclick="updateQty(this, 12)">+</button>
								</div>
							</div>

							<div class="grid-item">
								<div class="grid-title">
									Sharbati Atta Paratha &bull; ₹25
								</div>
								<div class="grid-qty-ctrl">
									<button onclick="updateQty(this, -25)">-</button>
									<span class="qty">0</span>
									<button onclick="updateQty(this, 25)">+</button>
								</div>
							</div>

							<div class="grid-item">
								<div class="grid-title">
									Khapli Atta Roti &bull; ₹20
								</div>
								<div class="grid-qty-ctrl">
									<button onclick="updateQty(this, -20)">-</button>
									<span class="qty">0</span>
									<button onclick="updateQty(this, 20)">+</button>
								</div>
							</div>

							<div class="grid-item">
								<div class="grid-title">
									Khapli Atta Paratha &bull; ₹35
								</div>
								<div class="grid-qty-ctrl">
									<button onclick="updateQty(this, -35)">-</button>
									<span class="qty">0</span>
									<button onclick="updateQty(this, 35)">+</button>
								</div>
							</div>

							<div class="grid-item">
								<div class="grid-title">
									<b>Order Total</b>
								</div>
								<div class="grid-qty-ctrl">
									<b id="orderTotal">₹0</b>
								</div>
							</div>
						</div>

						<div class="form-submit center-align">
							<a onclick="onSubmit()" class="waves-effect waves-light red darken-2 btn"><i class="material-icons right">send</i>proceed</a>
						</div>
					</div>
				</div>
			</div>
		</main>

		<footer>
			&copy; 2026 - GolRoti
		</footer>

    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script type="text/javascript" src="./js/script.js"></script>
  </body>

</html>
